name: Backend CI

# Runs on every push and pull request that touches backend/ or
# decision_engine/ code, so a broken change is caught before it merges
# rather than discovered live during the demo.
on:
  push:
    branches: [main, development]
    paths:
      - "backend/**"
      - "decision_engine/**"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "decision_engine/**"
      - "data/**"
      - "requirements.txt"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run backend + decision_engine test suite
        run: |
          pytest decision_engine/test/ backend/tests/ -v

      - name: Build Docker image (build only, not pushed)
        run: |
          docker build -f backend/Dockerfile -t inuka-backend:ci .

      - name: Smoke-test the built image
        run: |
          docker run -d --name inuka-ci -p 8000:8000 inuka-backend:ci
          # Give the container a moment to finish startup (DB init + seed)
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/health; then
              echo "Health check passed."
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed after startup window."
          docker logs inuka-ci
          exit 1

      - name: Clean up container
        if: always()
        run: docker rm -f inuka-ci || true
